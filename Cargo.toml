[package]
name = "kernship"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "kernship"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31.1"
ab_glyph = "0.2.32"
ttf-parser = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
parking_lot = "0.12"
libc = "0.2"
flate2 = "1"
brotli = "7"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
core-foundation = "0.9.4"
core-foundation-sys = "0.8.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWorkspace", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSView", "NSResponder", "NSEvent", "NSImage", "NSPasteboard", "NSGraphics", "NSBitmapImageRep", "NSImageRep", "NSWindow", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSCell", "NSButtonCell", "NSActionCell", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSRunningApplication", "NSOpenPanel", "NSSavePanel", "NSPanel"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSArray", "NSGeometry", "NSData", "NSObject", "NSDictionary"] }
raw-window-handle = "0.6"
muda = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 3
